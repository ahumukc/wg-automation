[General]
# Absolute path to the folder where client subfolders are stored
CLIENTS_FOLDER_PATH = /etc/wgau/clients
# Path to the WireGuard server config file
WIREGUARD_CONFIG_FILE = /etc/wireguard/wg0.conf
# Folder for deleted clients: 'wgau delete' moves client folders here
TRASH_FOLDER_PATH = /etc/wgau/trash

[Wireguard]
# Endpoint of your WireGuard server
ENDPOINT = vpn.example.com:51820
# Base address for clients (from [Interface] Address, without last octet)
ADDRESS_BASE = 10.7.0
# DNS server for the client
DNS_SERVER = 1.1.1.1, 1.0.0.1

[Naming]
# Prefix for client folders
CLIENT_PREFIX = client